version: 2
# DEPENDABOT_NPM_TOKEN: a token with read:packages, added under
# Settings → Secrets → Dependabot (Actions secrets are not visible to Dependabot).
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_NPM_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /
    registries: [github-packages]
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@33audits/standards"
